services:
  - type: web
    name: kids-companion-platform
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run render:start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: CLIENT_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kids-companion-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-5-mini
      - key: AI_TIMEOUT_MS
        value: "15000"
      - key: AI_PRIVACY_MODE
        value: strict

databases:
  - name: kids-companion-db
    plan: free
    region: singapore
    databaseName: companion
    user: companion
