<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>儿童远程伴学互动平台</title>
    <style>
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;color:#32425f;background:linear-gradient(145deg,#e7f3ff,#f6efff 55%,#fff8df);display:grid;place-items:center}
      .wrap{position:relative;width:min(920px,90vw);text-align:center;padding:42px 0}
      .language-switcher{position:fixed;top:22px;right:22px;display:inline-flex;gap:4px;padding:5px;border-radius:999px;background:#ffffffcc;border:1px solid #dce8fb;box-shadow:0 12px 28px #607b9e20;backdrop-filter:blur(10px)}
      .language-switcher button{border:0;background:transparent;color:#6f7f99;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:800;cursor:pointer}
      .language-switcher button.active{background:#3973ca;color:#fff;box-shadow:0 6px 15px #3973ca30}
      .mark{display:grid;place-items:center;width:60px;height:60px;margin:auto;border-radius:18px;background:#fff;color:#3671ca;font-size:30px;font-weight:800;box-shadow:0 10px 30px #6684ad33}
      .eyebrow{color:#6f8bb5;font-size:12px;font-weight:700;letter-spacing:2px}
      .wrap h1{font-size:38px;margin:18px 0 8px;color:#425b83}
      .wrap>p{color:#7f8fa9}
      .roles{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:38px}
      .role{background:#ffffffd9;border:1px solid #fff;border-radius:22px;padding:28px 22px;text-decoration:none;color:inherit;box-shadow:0 18px 45px #607b9e1d;transition:.2s}
      .role:hover{transform:translateY(-5px);box-shadow:0 24px 55px #607b9e32}
      .role span{font-size:42px}
      .role h2{font-size:19px;margin:12px 0 5px}
      .role p{font-size:12px;color:#8b96a7;min-height:36px}
      .role b{display:inline-block;margin-top:12px;color:#3973ca;font-size:12px}
      .notice{margin-top:30px;font-size:11px;color:#98a2b1}
      @media(max-width:700px){.roles{grid-template-columns:1fr}.wrap{padding:70px 0 35px}.wrap h1{font-size:28px}.role p{min-height:0}.language-switcher{top:14px;right:14px}}
    </style>
  </head>
  <body>
    <div class="language-switcher" aria-label="Language">
      <button type="button" data-lang-button="zh">中文</button>
      <button type="button" data-lang-button="en">English</button>
    </div>
    <main class="wrap">
      <div class="mark">伴</div>
      <p class="eyebrow">KIDS COMPANION LEARNING</p>
      <h1 data-i18n data-zh="儿童远程伴学互动平台" data-en="Kids Companion Learning Platform">儿童远程伴学互动平台</h1>
      <p data-i18n data-zh="实时白板、课件同步、正向奖励与温和专注提醒" data-en="Live whiteboard, courseware sync, positive rewards, and gentle focus reminders">实时白板、课件同步、正向奖励与温和专注提醒</p>
      <section class="roles">
        <a class="role" href="/student/">
          <span>🌟</span>
          <h2 data-i18n data-zh="我是学生" data-en="I am a Student">我是学生</h2>
          <p data-i18n data-zh="进入温馨、有趣的伴学空间" data-en="Enter a warm and fun companion learning space">进入温馨、有趣的伴学空间</p>
          <b data-i18n data-zh="打开学生端 →" data-en="Open Student App →">打开学生端 →</b>
        </a>
        <a class="role" href="/teacher/">
          <span>👩‍🏫</span>
          <h2 data-i18n data-zh="我是教师" data-en="I am a Teacher">我是教师</h2>
          <p data-i18n data-zh="创建课堂并进行实时互动教学" data-en="Create classes and teach interactively in real time">创建课堂并进行实时互动教学</p>
          <b data-i18n data-zh="打开教师端 →" data-en="Open Teacher App →">打开教师端 →</b>
        </a>
        <a class="role" href="/admin/">
          <span>🛡️</span>
          <h2 data-i18n data-zh="平台管理" data-en="Platform Admin">平台管理</h2>
          <p data-i18n data-zh="管理账号、分组与课堂记录" data-en="Manage accounts, groups, and class records">管理账号、分组与课堂记录</p>
          <b data-i18n data-zh="打开管理后台 →" data-en="Open Admin Console →">打开管理后台 →</b>
        </a>
      </section>
      <p class="notice" data-i18n data-zh="演示环境仅用于产品体验，请勿录入真实儿童敏感信息。" data-en="This demo is for product experience only. Do not enter real children's sensitive information.">演示环境仅用于产品体验，请勿录入真实儿童敏感信息。</p>
    </main>
    <script>
      (() => {
        const key = "companion_language";
        const title = {
          zh: "儿童远程伴学互动平台",
          en: "Kids Companion Learning Platform"
        };
        const readLanguage = () => localStorage.getItem(key) === "en" ? "en" : "zh";
        const applyLanguage = (language) => {
          localStorage.setItem(key, language);
          document.documentElement.lang = language === "en" ? "en" : "zh-CN";
          document.title = title[language];
          document.querySelectorAll("[data-i18n]").forEach((element) => {
            element.textContent = element.dataset[language];
          });
          document.querySelectorAll("[data-lang-button]").forEach((button) => {
            button.classList.toggle("active", button.dataset.langButton === language);
          });
        };
        document.querySelectorAll("[data-lang-button]").forEach((button) => {
          button.addEventListener("click", () => applyLanguage(button.dataset.langButton));
        });
        applyLanguage(readLanguage());
      })();
    </script>
  </body>
</html>
